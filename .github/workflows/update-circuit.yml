name: Atualizar Circuito de Commits

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: write

concurrency:
  group: profile-circuit
  cancel-in-progress: false

jobs:
  circuit:
    if: github.repository == 'lucazolvr/lucazolvr'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Preparar renderizador
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scripts/requirements.txt
      - name: Validar geometria e integridade dos dados
        run: .venv/bin/python -m unittest discover -s tests
      - name: Ler calendário público e gerar pista
        run: .venv/bin/python scripts/render_circuit.py --refresh
      - name: Salvar somente os dados e imagens atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-panel.svg assets/commit-circuit.svg assets/commit-circuit.gif assets/commit-circuit.png assets/circuit-map.json data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar Circuito de Commits [skip ci]'
            git push
          fi
